name: Telegram webhook upload

on:
  repository_dispatch:
    types: [telegram_upload]

permissions:
  contents: write

concurrency:
  group: autovid-state
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Process Telegram upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}
        run: python -m autovid bot-update --update-json "$TELEGRAM_UPDATE_JSON"

      - name: Commit Telegram state
        if: always()
        run: |
          git config user.name "autovid-bot"
          git config user.email "autovid-bot@users.noreply.github.com"
          git add -A state
          if [ -f scripts.json ]; then git add scripts.json; fi
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "autovid: telegram webhook state update [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done

      - name: Notify Telegram about workflow failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/autovid-error-notified" ]; then
            echo "Detailed exception alert was already sent from the Autovid process."
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials are unavailable; cannot send failure alert."
            exit 0
          fi
          MESSAGE="⚠️ Telegram upload workflow ব্যর্থ হয়েছে। Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --connect-timeout 10 --max-time 20 --silent --show-error --fail \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
