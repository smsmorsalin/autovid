name: Daily video

on:
  schedule:
    # 04:00 UTC = 10:00 Bangladesh time.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic. Leave empty to use the next queued script/topic."
        required: false
        type: string
      style:
        description: "Video style for a manual topic"
        required: false
        default: explainer
        type: choice
        options: [explainer, timeline3d]

permissions:
  contents: write

concurrency:
  group: autovid-state
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core \
            fonts-dejavu-core fonts-noto-color-emoji
          fc-list :lang=bn family | sort -u | head

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Notify Telegram that video generation is starting
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import os
          from autovid.notify import telegram_message

          topic = os.environ.get("TOPIC", "").strip()
          label = f" ({topic})" if topic else ""
          telegram_message(f"🎬 ভিডিও তৈরি শুরু হয়েছে{label}। শেষ হলে রিভিউ ভিডিও পাঠাব।")
          PY

      - name: Create one video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TOPIC: ${{ inputs.topic }}
          STYLE: ${{ inputs.style }}
        run: |
          if [ -n "$TOPIC" ]; then
            python -m autovid make \
              --topic "$TOPIC" \
              --style "${STYLE:-explainer}" \
              --out "out/manual-$(date +%F-%H%M)" \
              --notify
          else
            python -m autovid next
          fi

      - name: Stage the result
        if: always()
        run: |
          META=$(find out -name meta.json | head -n 1)
          if [ -z "$META" ]; then
            echo "No rendered meta.json found"
            exit 0
          fi
          mkdir -p stage
          D=$(dirname "$META")
          cp "$D/final.mp4" "$D/meta.json" "$D/script.json" stage/

      - name: Upload rendered files as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: stage
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit queue and Telegram state
        if: always()
        run: |
          git config user.name "autovid-bot"
          git config user.email "autovid-bot@users.noreply.github.com"
          git add -A state
          if [ -f scripts.json ]; then git add scripts.json; fi
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "autovid: state update [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done

      - name: Notify Telegram about workflow failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/autovid-error-notified" ]; then
            echo "Detailed exception alert was already sent from the Autovid process."
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials are unavailable; cannot send failure alert."
            exit 0
          fi
          MESSAGE="⚠️ ভিডিও তৈরির workflow ব্যর্থ হয়েছে। Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --connect-timeout 10 --max-time 20 --silent --show-error --fail \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
