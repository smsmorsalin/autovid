name: Publish

# Approval step: after you watch the video in Telegram, run this workflow with that run's ID.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the 'Daily video' run to publish (the number in its URL)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Notify Telegram that publishing is starting
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from autovid.notify import telegram_message; telegram_message("📤 ভিডিও প্রকাশের কাজ শুরু হয়েছে। শেষ হলে ফলাফল জানাব।")'

      - name: Download the approved video
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "${{ github.repository }}" -n video -D approved

      - name: Locate the rendered video directory
        id: video
        run: |
          META=$(find approved -name meta.json | head -n 1)
          if [ -z "$META" ]; then
            echo "No meta.json in the downloaded artifact" >&2
            exit 1
          fi
          echo "dir=$(dirname "$META")" >> "$GITHUB_OUTPUT"

      - name: Publish to enabled platforms
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m autovid publish --dir "${{ steps.video.outputs.dir }}"

      - name: Notify Telegram about workflow failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/autovid-error-notified" ]; then
            echo "Detailed exception alert was already sent from the Autovid process."
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials are unavailable; cannot send failure alert."
            exit 0
          fi
          MESSAGE="⚠️ Publish workflow ব্যর্থ হয়েছে। Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --connect-timeout 10 --max-time 20 --silent --show-error --fail \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
